<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#106b57" />
    <title>Lucky 9</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-mark" aria-hidden="true">9</div>
        <div>
          <h1>Lucky 9</h1>
          <p id="sessionLine" class="session-line">No session</p>
        </div>
        <button id="installButton" class="icon-button hidden" type="button" title="Install app" aria-label="Install app">
          <span aria-hidden="true">+</span>
        </button>
      </header>

      <div id="statusBar" class="status-bar" role="status" aria-live="polite"></div>
      <main id="app" class="app-main"></main>
    </div>

    <script src="/config.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
